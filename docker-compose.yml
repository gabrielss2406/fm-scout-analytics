version: '3.8'

services:
  fm-scout:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fm-moneyball-scout
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - fm-scout-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fm-scout.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.fm-scout.entrypoints=websecure"
      - "traefik.http.routers.fm-scout.tls.certresolver=myresolver"

  # Optional: Add a reverse proxy for production
  # traefik:
  #   image: traefik:v2.10
  #   container_name: traefik
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--providers.docker.exposedbydefault=false"
  #     - "--entrypoints.web.address=:80"
  #     - "--entrypoints.websecure.address=:443"
  #     - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
  #     - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
  #     - "--certificatesresolvers.myresolver.acme.email=your-email@domain.com"
  #     - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"
  #   volumes:
  #     - "/var/run/docker.sock:/var/run/docker.sock:ro"
  #     - "./letsencrypt:/letsencrypt"
  #   networks:
  #     - fm-scout-network

networks:
  fm-scout-network:
    driver: bridge

volumes:
  letsencrypt: